[project]
name = "shopagent"
version = "0.1.0"
description = "Conversational shopping assistant for product discovery, cart, and checkout"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "mcp>=2.0.0",
    "openai>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "sqlmodel>=0.0.22",
]

[project.scripts]
shopagent = "shopagent.main:run"
shopagent-mcp = "shopagent.mcp_server:main"

[tool.fastapi]
entrypoint = "shopagent.api.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
